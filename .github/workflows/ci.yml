name: verify
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.5 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run contract:test
      - name: Browser Safe integration smoke
        run: |
          anvil --chain-id 11155111 --port 8545 --silent > /tmp/anvil.log 2>&1 &
          ready=0
          for i in {1..30}; do if curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q aa36a7; then ready=1; break; fi; sleep 1; done
          if [ "$ready" -ne 1 ]; then cat /tmp/anvil.log; exit 1; fi
          bun run safe:smoke
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bunx playwright test --config playwright.preview.config.ts
      - name: Encrypted browser refresh recovery
        run: BROWSER_SEPOLIA_E2E=1 VITE_BROWSER_SEPOLIA_E2E=1 bun run test:e2e --grep "Sepolia persistence"
      - run: bash scripts/run-v3-lifecycle-browser-e2e.sh
      - run: bun run release:verify
      - run: bun audit
