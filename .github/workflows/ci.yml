name: verify
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.5 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run contract:test
      - name: Browser Safe integration smoke
        run: |
          anvil --fork-url https://ethereum-sepolia-rpc.publicnode.com --port 8545 --silent > /tmp/anvil.log 2>&1 &
          for i in {1..30}; do curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q aa36a7 && break; sleep 1; done
          bun run safe:smoke
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Encrypted browser refresh recovery
        run: BROWSER_SEPOLIA_E2E=1 VITE_BROWSER_SEPOLIA_E2E=1 bun run test:e2e --grep "Sepolia persistence"
      - run: bun run release:verify
      - run: bun audit
