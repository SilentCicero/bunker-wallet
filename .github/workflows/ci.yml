name: verify
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with: { version: v1.8.5 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run contract:test
      - run: cargo test --release --locked --manifest-path packages/pq/c10/Cargo.toml
      - name: Browser Safe integration smoke
        run: |
          anvil --chain-id 11155111 --port 8545 --silent > /tmp/anvil.log 2>&1 &
          ready=0
          for i in {1..30}; do if curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q aa36a7; then ready=1; break; fi; sleep 1; done
          if [ "$ready" -ne 1 ]; then cat /tmp/anvil.log; exit 1; fi
          bun run safe:smoke
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bunx playwright test --config playwright.preview.config.ts
      - name: Encrypted browser refresh recovery
        run: BROWSER_SEPOLIA_E2E=1 VITE_BROWSER_SEPOLIA_E2E=1 VITE_SEPOLIA_RPC=http://127.0.0.1:8545 bun run test:e2e --grep "Sepolia persistence"
      - run: bash scripts/run-v3-lifecycle-browser-e2e.sh
      - run: bun run release:verify
      - run: bun audit
